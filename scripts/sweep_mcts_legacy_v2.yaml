# =============================================================================
# v2 RERUN (2026-08-14) — FRESH PROJECT, one clean code version end to end.
#
# Identical experimental design to sweep_mcts_{chance,legacy}.yaml; the ONLY changes
# are the `project` (fresh, so v2 data never mixes with the partial earlier runs) and
# `leaf_only_pc: true`.
#
# WHY A RERUN: the earlier projects (spacecraftCA-mcts-{chance,legacy}) are partial and
# mixed-provenance — 375/480 and 356/480 unique cells finished, the 2 h cadence is the
# hole (30/120 and 46/120), and legacy has 40 crashed runs. Rather than backfill across
# two code versions, rerun everything on one.
#
# leaf_only_pc = true: skips the to-TCA Pc propagation at INTERNAL tree nodes (valid in
# :terminal reward mode, where the per-step reward is fuel-only and only the LEAF's Pc
# feeds p_viol / E[Pc]). Verified bit-identical action, per-action n / p_viol / E[Pc],
# and Qa to all digits on the 38771 defer case AT the alpha knife-edge (p_viol=0.0370
# vs alpha=0.05). ~1.7-2x faster; a 2 h-cadence 13-step episode runs in ~22 min.
# NOTE: it blanks the per-NODE .pc/.violated tree instrumentation, which only the local
# figure probes read (treezoom_probe.jl, phase6_tree_data.jl, phase6_ablation_data.jl).
# Every wandb metric is computed by the executor itself and is UNAFFECTED. If you ever
# want a tree dump from a sweep cell for a figure, rerun that one cell with false.
#
# LAUNCH: single-threaded per agent, else each agent spawns one BLAS thread per core
# (50 agents x 56 cores = ~2800 threads competing). Export before `wandb agent`:
#   OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 JULIA_NUM_THREADS=1 MKL_NUM_THREADS=1
# Memory measured at ~1.3 GB peak per agent (2 h cadence, n_iter=100), so 50 agents
# is ~64 GB of a 126 GB node.
# =============================================================================
# =============================================================================
# sweep_mcts_legacy.yaml — MCTS under the LEGACY soft-penalty root rule (argmax-Qa).
#
# The PAIRED regression/baseline twin of sweep_mcts_chance.yaml: IDENTICAL axes +
# seeds (cadence {2,4,8,24} × 8 cases × 3 quality × 5 seeds = 480 episodes,
# p_arrival = 1.0), but the ROOT decision uses the pre-2026-08-11 soft-penalty rule
# (root_rule = legacy): plain argmax over the per-action mean return Qa, WITH the
# in-tree 1e4 terminal penalty. This reproduces the OLD planner's decisions.
#
# WHY: every legacy cell is the twin of a chance cell at the SAME
# (case, quality, seed, cadence), so the old-vs-new decision difference is
# attributable to the RULE alone — not sampling noise. On 38771 best-quality the
# legacy rule panic-burns at step 1 (the 1e4-in-Qa knife-edge) where chance
# correctly defers. Run the two side by side; separate fresh projects.
#
# n_iterations = 100 to MATCH the chance sweep exactly (a fair paired comparison —
# the rollout budget must be identical). 12 h per-episode timeout; the 2 h-cadence
# cells are the slow tail.
# =============================================================================

program: scripts/wandb_runner.py
method: grid
project: spacecraftCA-mcts-legacy-v2      # v2 RERUN — fresh project
entity: kmeans_gsopt

command:
  - uv
  - run
  - python
  - ${program}
  - --timeout-s          # per-episode Julia timeout: 48 h (match the chance sweep;
  - "172800"             # generous headroom for the slow 2 h-cadence n_iter=100 cells).

parameters:
  cadence_h:
    values: [2, 4, 8, 24]
  case_path:
    values:
      - data/cara_cdms/000040059_conj_000035921_20220326_194122_20220325_215435.cdm
      - data/cara_cdms/000040115_conj_000030660_20230721_100115_20230720_061903.cdm
      - data/cara_cdms/000025994_conj_000026132_20220224_100307_20220221_225515.cdm
      - data/cara_cdms/000038771_conj_000030802_20201216_182131_20201215_171306.cdm
      - data/cara_cdms/000029108_conj_000034995_20220706_165058_20220705_143113.cdm
      - data/cara_cdms/000037849_conj_000013512_20210612_084905_20210611_062043.cdm
      - data/cara_cdms/000033591_conj_000042216_20211203_183431_20211202_153618.cdm
      - data/cara_cdms/000028654_conj_000041835_20220106_193032_20220105_161142.cdm
  sensor_quality:
    values: [best, median, worst]
  seed:
    values: [1, 2, 3, 4, 5]
  policy_variant:
    values: [mcts]

  # ---- fixed knobs ----
  p_arrival:
    value: 1.0
  sigma_mode:
    value: exact
  reward_mode:
    value: terminal
  constraint_mode:
    value: penalize
  # Skip the to-TCA Pc propagation at INTERNAL tree nodes (:terminal reward only).
  # Behavior-neutral: verified bit-identical action / p_viol / E[Pc] / Qa on the 38771
  # defer case at the alpha knife-edge; ~1.7-2x faster (2h 13-step episode: 22 min).
  # Logged here (not a module default) so every run records which path produced it.
  leaf_only_pc:
    value: true
  grid_mode:
    value: measurement
  # LEGACY soft-penalty root rule (argmax-Qa, WITH the 1e4 terminal penalty).
  root_rule:
    value: legacy
  alpha_cc:
    value: 0.05                        # ignored under legacy (no feasibility gate)
  n_iterations:
    value: 100                         # MATCH the chance sweep (fair paired budget)
